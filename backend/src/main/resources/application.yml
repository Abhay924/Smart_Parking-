
spring:
  application:
    name: smart-parking-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/smart_parking
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

flyway:
  enabled: true
  validate-on-migrate: true

logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.http.converter: DEBUG
    com.smartparking: DEBUG
    org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping: TRACE
